---
- name: Validate service state
  ansible.builtin.wait_for:
    port: '{{ k3s_server_api_port }}'
    timeout: 30
  any_errors_fatal: true

- name: Install kustomize
  kubernetes.core.k8s:
    definition: "{{ lookup('kubernetes.core.kustomize', dir='{{ role_path }}/../../kubernetes/networking/coredns', enable_helm=True) }}"
    kubeconfig: '/etc/rancher/k3s/k3s.yaml'
    wait: true
  register: coredns_result
  delay: 1
  retries: 3
  until: coredns_result is not failed
  run_once: true
