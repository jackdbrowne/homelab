---
# - name: Validate service state
#   ansible.builtin.wait_for:
#     port: '{{ k3s_server_api_port }}'
#     timeout: 30
#   any_errors_fatal: true

- name: Install cilium-cli
  ansible.builtin.import_tasks:
    file: install.yaml

- name: Install
  run_once: true
  block:
    - name: Install Gateway API
      kubernetes.core.k8s:
        kubeconfig: '/etc/rancher/k3s/k3s.yaml'
        src: "https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ gateway_api_version  }}/experimental-install.yaml"
      register: gateway_api_result
      delay: 1
      retries: 3
      until: gateway_api_result is not failed

    - name: Install Cilium
      kubernetes.core.k8s:
        definition: "{{ lookup('kubernetes.core.kustomize', dir='{{ role_path }}/../../kubernetes/networking/cilium', enable_helm=True) }}"
        kubeconfig: '/etc/rancher/k3s/k3s.yaml'
        wait: true
      register: cilium_result
      delay: 1
      retries: 3
      until: cilium_result is not failed