---
- name: Install packages
  ansible.builtin.apt:
    name: '{{ item }}'
    autoremove: true
    update_cache: true
  loop:
    - python3-kubernetes
    - git

- name: Add variables to environment file
  ansible.builtin.lineinfile:
    path: /etc/environment
    line: '{{ item.key }}={{ item.value }}'
    regexp: ^{{ item.key }}
  loop: "{{ lookup('ansible.builtin.dict', helm_default_environment | combine(helm_environment)) | sort(attribute='key') }}"

- name: Initialize variables
  ansible.builtin.shell: |
    set -eo pipefail
    source /etc/environment
  args:
    executable: /bin/bash
  changed_when: false

- name: Install helm
  ansible.builtin.import_tasks:
    file: install.yaml

- name: Helm Cache
  notify: Start cache service
  block:
    - name: Create service file
      ansible.builtin.template:
        src: service.j2
        dest: /etc/systemd/system/helm-cache.service
        owner: root
        group: root
        mode: '644'

    - name: Create service timer file
      ansible.builtin.template:
        src: timer.j2
        dest: /etc/systemd/system/helm-cache.timer
        owner: root
        group: root
        mode: '644'

- name: Flush handlers
  ansible.builtin.meta: flush_handlers