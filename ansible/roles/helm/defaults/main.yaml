---
helm_version: v3.22.1
helm_install_dir: /usr/local/bin
helm_environment: {}
helm_default_environment:
  HELM_CACHE_HOME: '/usr/local/share/helm/cache'
  HELM_CONFIG_HOME: '/usr/local/share/helm/config'
  HELM_DATA_HOME: '/usr/local/share/helm'
  HELM_PLUGINS: '/usr/local/share/helm/plugins'
  HELM_REGISTRY_CONFIG: '/usr/local/share/helm/config/registry/config.json'
  HELM_REPOSITORY_CACHE: '/usr/local/share/helm/cache/repository'
  HELM_REPOSITORY_CONFIG: '/usr/local/share/helm/config/repositories.yaml'