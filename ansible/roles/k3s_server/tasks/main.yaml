---
- name: Create K3s service file
  register: k3s_service
  ansible.builtin.template:
    src: k3s.service.j2
    dest: "/etc/systemd/system/k3s.service"
    owner: root
    group: root
    mode: "0644"

- name: Construct K3s server config
  block:
    # Start with an empty config
    - name: Set empty server config
      ansible.builtin.set_fact:
        k3s_server_config: {}

    # If token is provided, add it to the config
    - name: Add token to server config
      when: k3s_token is defined
      ansible.builtin.set_fact:
        k3s_server_config: "{{ k3s_server_config | combine({'token': k3s_token}) }}"
    
    - name: Add tls-san to server config
      ansible.builtin.set_fact:
        k3s_server_config: "{{ k3s_server_config | combine({'tls-san': k3s_server_api_endpoint}) }}"
    
    - name: Add node taints to server config
      when: k3s_node_taint is defined and (k3s_node_taint | length) > 0
      ansible.builtin.set_fact:
        k3s_server_config: "{{ k3s_server_config | combine({'node-taint': k3s_node_taint}) }}"

    
    - name: Add cluster-init to server config for first server in HA cluster
      when:
        - (groups['server'] | length) > 1
        - inventory_hostname == groups['server'][0]
      ansible.builtin.set_fact:
        k3s_server_config: "{{ k3s_server_config | combine({'cluster-init': true}) }}"

    # If not the first server in an HA setup, setup the server: URL for joining the cluster
    # server: https://{{ api_endpoint }}:{{ api_port }}
    - name: Add server URL to server config for joining servers in HA-IC setup
      when: (groups['server'] | length) > 1 and inventory_hostname != groups['server'][0]
      ansible.builtin.set_fact:
        k3s_server_config: "{{ k3s_server_config | combine({'server': 'https://' + (k3s_server_api_endpoint | ansible.utils.ipwrap) + ':' + k3s_server_api_port | string}) }}"

    - name: Merge user server config with generated server config
      when: k3s_server_config_yaml is defined
      ansible.builtin.set_fact:
        k3s_server_config: "{{ k3s_server_config | combine(k3s_server_config_yaml | from_yaml) }}"

- name: Create kube-vip static pod manifest 
  ansible.builtin.template:
    src: kube-vip.pod.yaml.j2
    dest: /var/lib/rancher/k3s/agent/pod-manifests/kube-vip.yaml
    owner: root
    group: root
    mode: "0644"

- name: Init first server node
  when: inventory_hostname == groups['server'][0]
  block:

    # - name: Deploy vip manifest
    #   ansible.builtin.include_tasks: kube_vip.yaml

    - name: Convert server config to YAML and write to file
      when: not ansible_check_mode
      ansible.builtin.copy:
        content: "{{ k3s_server_config | to_nice_yaml }}"
        dest: "/etc/rancher/k3s/config.yaml"
        mode: "0640"
      register: k3s_server_config_result

    - name: Reload systemd daemon
      when:
        - not ansible_check_mode
        - ansible_facts['service_mgr'] == 'systemd'
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and start K3s service
      when: not ansible_check_mode
      ansible.builtin.service:
        name: k3s
        state: restarted
        enabled: true

    - name: Pause to allow first server startup
      when: (groups['server'] | length) > 1
      ansible.builtin.pause:
        seconds: 10

    - name: Get the token if randomly generated
      when:
        - not ansible_check_mode
        - token is not defined
      block:
        - name: Wait for token
          ansible.builtin.wait_for:
            path: /var/lib/rancher/k3s/server/token

        - name: Read node-token from first server
          ansible.builtin.slurp:
            src: /var/lib/rancher/k3s/server/token
          register: k3s_server_node_token

        - name: Store random token for later servers
          # noqa var-naming[no-role-prefix]
          ansible.builtin.set_fact:
            random_token: "{{ k3s_server_node_token.content | b64decode | regex_replace('\n', '') }}"

# Limit join checks to completed and current batches during serial installation.
- name: Count the servers this play has already started
  ansible.builtin.set_fact:
    k3s_server_started_count: "{{ ansible_play_hosts_all.index(ansible_play_batch[-1]) + 1 }}"

- name: Start other server if any and verify status
  when:
    - (groups['server'] | length) > 1
    - inventory_hostname != groups['server'][0]
  block:
    - name: Get token from first server if needed
      when: token is not defined and hostvars[groups['server'][0]].random_token is defined
      # noqa var-naming[no-role-prefix]
      ansible.builtin.set_fact:
        k3s_server_config: "{{ k3s_server_config | combine({'token': hostvars[groups['server'][0]].random_token}) }}"

    - name: Convert server config to YAML and write to file
      when: not ansible_check_mode
      ansible.builtin.copy:
        content: "{{ k3s_server_config | to_nice_yaml }}"
        dest: "/etc/rancher/k3s/config.yaml"
        mode: "0640"
      register: k3s_server_config_result
    
    - name: Reload systemd daemon
      when:
        - not ansible_check_mode
        - ansible_facts['service_mgr'] == 'systemd'
      ansible.builtin.systemd:
        daemon_reload: true

    # Always restart a joined server so a re-run of site.yml — whether it only
    # bumped k3s_version or changed config — brings it onto the new runtime, the
    # same way the first server above always restarts. On a multi-server cluster
    # set k3s_server_serial to 1 so the servers restart one at a time (see README).
    - name: Restart K3s service
      when:
        - ansible_facts.services['k3s.service'] is defined
        - ansible_facts.services['k3s.service'].state == 'running'
      ansible.builtin.service:
        name: k3s
        state: restarted

    - name: Enable and start K3s service
      when: ansible_facts.services['k3s.service'] is not defined or ansible_facts.services['k3s.service'].state != 'running'
      ansible.builtin.service:
        name: k3s
        state: started
        enabled: true

    - name: Verify that the servers started so far joined
      when: not ansible_check_mode
      ansible.builtin.command:
        cmd: >
          k3s kubectl get nodes -l "node-role.kubernetes.io/control-plane=true" -o=jsonpath="{.items[*].metadata.name}"
      register: k3s_server_nodes
      until:
        - k3s_server_nodes.rc == 0
        - (k3s_server_nodes.stdout.split() | length) >= (k3s_server_started_count | int)
      retries: 20
      delay: 10
      changed_when: false

- name: Wait for control plane to be ready
  run_once: true
  block:
    - name: Wait for control plane using api_endpoint
      ansible.builtin.wait_for:
        host: "{{ k3s_server_api_endpoint }}"
        port: "{{ k3s_server_api_port }}"
        timeout: 60
      changed_when: false

  rescue:
    - name: Wait for control plane using localhost
      ansible.builtin.wait_for:
        host: localhost
        port: "{{ k3s_server_api_port }}"
        timeout: 60
      changed_when: false

- name: Wait for the servers started so far to be etcd voters
  when:
    - not ansible_check_mode
    - (groups['server'] | length) > 1
  ansible.builtin.command:
    cmd: >-
      k3s kubectl --request-timeout=10s get nodes -l "node-role.kubernetes.io/etcd=true"
      -o=jsonpath='{range .items[*]}{.metadata.name}={.status.conditions[?(@.type=="EtcdIsVoter")].status}{"\n"}{end}'
  register: k3s_server_etcd_voters
  until:
    - k3s_server_etcd_voters.rc == 0
    - (k3s_server_etcd_voters.stdout.split() | length) >= (k3s_server_started_count | int)
    - (k3s_server_etcd_voters.stdout.split() | reject('search', '=True$') | list | length) == 0
  retries: 30
  delay: 10
  changed_when: false

- name: Create symlinks
  ansible.builtin.file:
    path: '/usr/local/bin/{{ item }}'
    src: '/usr/local/bin/k3s'
    state: link
  loop:
    - crictl
    - ctr
    - kubectl

- name: Setup kubectl for user
  when: k3s_server_user_kubectl
  block:
    - name: Check if user bashrc exists
      ansible.builtin.stat:
        path: "~{{ ansible_user | default(ansible_env.USER) }}/.bashrc"
      register: k3s_server_bashrc

    - name: Create directory .kube
      ansible.builtin.file:
        path: ~{{ ansible_user | default(ansible_env.USER) }}/.kube
        state: directory
        owner: "{{ ansible_user | default(ansible_env.USER) }}"
        mode: "u=rwx,g=rx,o="

    - name: Copy config file to user home directory
      when: not ansible_check_mode
      ansible.builtin.copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: ~{{ ansible_user | default(ansible_env.USER) }}/.kube/config
        remote_src: true
        owner: "{{ ansible_user | default(ansible_env.USER) }}"
        mode: "u=rw,g=,o="

    - name: Configure default KUBECONFIG for user
      when: k3s_server_bashrc.stat.exists
      ansible.builtin.lineinfile:
        path: ~{{ ansible_user | default(ansible_env.USER) }}/.bashrc
        regexp: 'export KUBECONFIG=~/.kube/config'
        line: 'export KUBECONFIG=~/.kube/config # Added by k3s-ansible'
        state: present
