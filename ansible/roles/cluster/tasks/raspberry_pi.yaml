---
- name: Check for raspberry Pi
  block:
    - name: Test for raspberry pi /proc/cpuinfo
      ansible.builtin.command: grep -E "Raspberry Pi|BCM2708|BCM2709|BCM2835|BCM2836" /proc/cpuinfo
      register: grep_cpuinfo_raspberrypi
      failed_when: false
      changed_when: false
      check_mode: false

    - name: Test for raspberry pi /proc/device-tree/model
      ansible.builtin.command: grep -E "Raspberry Pi" /proc/device-tree/model
      register: grep_device_tree_model_raspberrypi
      failed_when: false
      changed_when: false
      check_mode: false

    - name: Set raspberry_pi fact to true
      ansible.builtin.set_fact:
        raspberry_pi: true
      when: (grep_cpuinfo_raspberrypi.rc | default(1)) == 0 or (grep_device_tree_model_raspberrypi.rc | default(1)) == 0

- name: Enable cgroup
  when: raspberry_pi|default(false)
  block:
    - name: Check if /boot/firmware/cmdline.txt exists
      ansible.builtin.stat:
        path: /boot/firmware/cmdline.txt
      register: boot_firmware_cmdline_txt

    - name: Enable cgroup via boot commandline if not already enabled
      ansible.builtin.replace:
        path: "{{ (boot_firmware_cmdline_txt.stat.exists) | ternary('/boot/firmware/cmdline.txt', '/boot/cmdline.txt') }}"
        regexp: ^([\w](?!.*\b{{ cgroup_item }}\b).*)$
        replace: \1 {{ cgroup_item }}
      with_items:
        - cgroup_enable=cpuset
        - cgroup_memory=1
        - cgroup_enable=memory
      loop_control:
        loop_var: cgroup_item
      notify:
        Reboot
