---
- name: Hardware Configuration
  notify: Reboot
  block:
    - name: Configure services
      block:
        - name: Set service facts
          ansible.builtin.service_facts:

        - name: Bluetooth Configuration
          when: disable_bluetooth is truthy
          block:
            - name: Disable bluetooth service
              ansible.builtin.systemd_service:
                name: bluetooth.service
                state: stopped
                enabled: false
              when: ansible_facts.services['bluetooth.service'] is defined

            - name: Disable hciuart service
              ansible.builtin.systemd_service:
                name: hciuart.service
                state: stopped
                enabled: false
              when: ansible_facts.services['hciuart.service'] is defined

        - name: WiFi Configuration
          when: disable_wifi is truthy
          block:
            - name: Disable wifi service
              ansible.builtin.systemd_service:
                name: wpa_supplicant.service
                state: stopped
                enabled: false
              when: ansible_facts.services['wpa_supplicant.service'] is defined

        - name: Disable snapd services
          when: disable_snapd is truthy
          ansible.builtin.systemd_service:
            name: '{{ item }}'
            state: stopped
            enabled: false
          loop:
            - snapd.apparmor.service
            - snapd.service
            - snapd.seeded.service
            - snapd.socket

        - name: Disable firewall service
          ansible.builtin.systemd_service:
            name: ufw.service
            state: stopped
            enabled: false

    - name: Mounted Filesystem
      block:
        - name: Configure fstrim
          block:
            - name: Start fstrim service
              ansible.builtin.systemd_service:
                name: fstrim.timer
                state: started
                daemon_reload: true
                enabled: true

            - name: Discard unused blocks on mounted filesystem
              ansible.builtin.command:
                cmd: fstrim -vA
              changed_when: cluster_command.stdout.find('trimmed') != -1
              register: cluster_command

        - name: Mount additional volumes
          block:
            - name: Create the target mount directory
              ansible.builtin.file:
                path: '{{ item.dir }}'
                state: directory
                mode: '0755'
                owner: root
                group: root
              loop: "{{ disk_mounts }}"

            - name: Format the disk
              community.general.filesystem:
                fstype: '{{ item.fstype }}'
                dev: '{{ item.disk }}'
                state: present
              loop: "{{ disk_mounts }}"

            - name: Permanently mount the disk
              ansible.posix.mount:
                path: '{{ item.dir }}'
                src: '{{ item.disk }}'
                fstype: '{{ item.fstype }}'
                opts: defaults,noatime
                state: mounted
              loop: "{{ disk_mounts }}"

        - name: Disable access time updates
          ansible.builtin.replace:
            path: /etc/fstab
            regexp: defaults\t0
            replace: defaults,noatime\t0
          notify: Reboot

    - name: Disable swap
      when: disable_swap
      block:
        - name: Turn off swap now
          ansible.builtin.command: swapoff -a
          register: swapoff_result
          changed_when: false
          failed_when: false

        - name: Comment out swap entries in fstab
          ansible.builtin.replace:
            path: /etc/fstab
            regexp: '^([^#][^\n]*\s+swap\s+)'
            replace: '# \\1'
          register: fstab_swap

- name: Raspberry Pi Configuration
  ansible.builtin.import_tasks:
    file: raspberry_pi.yaml

- name: OS Configuration
  block:
    - name: Install cifs utilities package
      ansible.builtin.apt:
        name: '{{ item }}'
        autoremove: true
        update_cache: true
      loop:
        - cifs-utils
        - open-iscsi
        - nfs-common

    - name: Load kernel modules
      ansible.builtin.copy:
        content: |
          br_netfilter
          overlay
        dest: /etc/modules-load.d/kubernetes.conf
        owner: root
        group: root
        mode: '644'
      notify: Reboot
