---
- name: Validate host
  block:
    - name: Check internet connectivity
      ansible.builtin.wait_for:
        host: github.com
        port: 443
        timeout: 30
  any_errors_fatal: true

- name: Cluster Provisioning
  block:
    - name: Cluster Configuration
      ansible.builtin.import_tasks:
        file: configuration.yaml

    - name: Cluster Upgrade
      ansible.builtin.import_tasks:
        file: upgrade.yaml
