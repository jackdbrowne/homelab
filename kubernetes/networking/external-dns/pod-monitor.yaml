---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: external-dns
  namespace: external-dns
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns # Matches the labels on your external-dns pods
  podMetricsEndpoints:
  - port: http
    path: /metrics
    interval: 30s